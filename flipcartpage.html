<!DOCTYPE html>
<html lang="en"> 
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="flipcartpage.css">
    </head>
    <body>
        <div class="searchbar" title="search bar">
            <div class="lefthalf">
                <img class="logo" src="assets/images/flipcart_pluslogo.png" alt="Flipcart">
                <div class="customsearch">
                    <input class="search" type="text" placeholder="Search for products, brands and more">
                    <i class="fas fa-search searchbtn" style="color: #1a73e8;"></i>
                </div>
            </div>
            <span style="width: 10%;"></span>
            <div class="righthalf">
                <button class="loginbtn">Login</button>
                <div class="dropdown more-div">
                    <button class="btn btn-secondary dropdown-toggle more" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        More
                    </button>
                    <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                      <a class="dropdown-item" href="#">Luxuary</a>
                      <a class="dropdown-item" href="#">coupons</a>
                      <a class="dropdown-item" href="#">Deals</a>
                    </div>
                </div>
                <button class="cart"><span><i class="fa-solid fa-cart-shopping"></i></span>Cart</button>
            </div>
            <div class="dropdown mydrop">
                <button class="btn btn-secondary dropdown-toggle dropdown-btn" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    <i class="fa-solid fa-bars" style="color: #ffffff;"></i>
                </button>
                <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                  <a class="dropdown-item" href="#">Login</a>
                  <a class="dropdown-item" href="#"><span><i class="fa-solid fa-cart-shopping" style="margin-right: 10px;"></i></span>Cart</a>
                  <a class="dropdown-item" href="#">More</a>
                </div>
            </div>
        </div>

        <!-- Navbar -->
        <nav class="navbar">
            <div class="navelm">
                <img id="topoffers" src="https://rukminim2.flixcart.com/fk-p-flap/64/64/image/6a99be02898b225d.jpg?q=100" alt="top offers">
                <label class="navlabel" for="topoffers">Top Offers</label>
            </div>
            <span class="space-bwt-items"></span>
            <div class="navelm">
                <img id="grocery" src="https://rukminim2.flixcart.com/fk-p-flap/64/64/image/1400d6186b839cde.jpg?q=100" alt="grocery">
                <label class="navlabel" for="grocery">Grocery</label>
            </div>
            <span class="space-bwt-items"></span>
            <div class="navelm">
                <img id="mobiles" src="https://rukminim2.flixcart.com/fk-p-flap/64/64/image/6c22d4999cdb4144.jpg?q=100" alt="mobiles">
                <label class="navlabel" for="mobiles">Mobiles</label>
            </div>
            <span class="space-bwt-items"></span>
            <div class="navelm">
                <img id="fashion" src="https://rukminim2.flixcart.com/fk-p-flap/64/64/image/46de73feaefc28cd.jpg?q=100" alt="fashion">
                <label class="navlabel" for="fashion">Fashion</label>
            </div>
            <span class="space-bwt-items"></span>
            <div class="navelm">
                <img id="electronics" src="https://rukminim2.flixcart.com/fk-p-flap/64/64/image/2e30d5fac47eff64.jpg?q=100" alt="electronics">
                <label class="navlabel" for="electronics">Electronics</label>
            </div>
            <span class="space-bwt-items"></span>
            <div class="navelm">
                <img id="home" src="https://rukminim2.flixcart.com/fk-p-flap/64/64/image/8538d487cd2bc8b7.jpg?q=100" alt="home">
                <label class="navlabel" for="home">Home</label>
            </div>
            <span class="space-bwt-items"></span>
            <div class="navelm">
                <img id="appliances" src="https://rukminim2.flixcart.com/fk-p-flap/64/64/image/4a5fb0c8e0461335.jpg?q=100" alt="appliances">
                <label class="navlabel" for="appliances">Appliances</label>
            </div>
            <span class="space-bwt-items"></span>
            <div class="navelm">
                <img id="travel" src="https://rukminim2.flixcart.com/fk-p-flap/64/64/image/49f31863cc17d101.jpg?q=100" alt="travel">
                <label class="navlabel" for="travel">Travel</label>
            </div>
            <span class="space-bwt-items"></span>
            <div class="navelm">
                <img id="toys" src="https://rukminim2.flixcart.com/fk-p-flap/64/64/image/800e00a6322c6985.jpg?q=100" alt="toys">
                <label class="navlabel" for="toys">Beauty, Toys & More</label>
            </div>
        </nav>
        <div></div>
    </body>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.2.1/dist/js/bootstrap.min.js" integrity="sha384-B0UglyR+jN6CkvvICOB2joaf5I4l3gm9GU6Hc1og6Ls7i6U/mkkaduKaBhlAXv9k" crossorigin="anonymous"></script>
</html>
